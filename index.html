<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f4c5c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Kore">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
    <title>Kore</title>
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <header class="topbar">
        <div>
          <p class="eyebrow">Аудио-гид</p>
          <h1 id="app-title">Kore</h1>
        </div>
        <span id="connectionBadge" class="badge">Подготовка</span>
      </header>

      <section class="download" aria-live="polite">
        <div class="download__copy">
          <h2 id="downloadTitle">Загрузка аудио</h2>
          <p id="downloadText">Подготавливаю записи для работы без интернета.</p>
        </div>
        <div
          id="progressBar"
          class="progress"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-label="Прогресс загрузки"
        >
          <span id="progressFill"></span>
        </div>
      </section>

      <section id="androidInstall" class="install install--android" hidden>
        <button id="installButton" class="primary-button" type="button" disabled>Установить</button>
      </section>

      <section id="iosInstall" class="install install--ios" hidden>
        <p>iOS: Поделиться -> На экран «Домой»</p>
      </section>

      <section class="player" aria-label="Плеер">
        <div class="now-playing">
          <p class="eyebrow">Сейчас</p>
          <h2 id="currentTitle">Выберите запись</h2>
        </div>
        <audio id="audio" controls preload="none"></audio>
      </section>

      <section class="track-section" aria-labelledby="track-list-title">
        <h2 id="track-list-title">Записи</h2>
        <div id="trackList" class="track-list"></div>
      </section>
    </main>
  </body>
</html>
